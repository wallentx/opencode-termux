name: Build Android Bun runtime
description: Compile the application's pinned Bun with Android arm64 FFI support
inputs:
  source-dir:
    description: Checkout containing the package.json that pins Bun
    required: false
    default: "."
runs:
  using: composite
  steps:
    - name: Resolve Bun and LLVM from source
      id: tools
      shell: bash
      env:
        SOURCE_DIR: ${{ inputs.source-dir }}
      run: |
        set -euo pipefail
        package_manager="$(node -p 'require(process.argv[1]).packageManager' "$GITHUB_WORKSPACE/$SOURCE_DIR/package.json")"
        if [[ ! "$package_manager" =~ ^bun@([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
          echo "::error::Expected an exact Bun release, got $package_manager"
          exit 1
        fi
        bun_version="${BASH_REMATCH[1]}"
        git clone --depth=1 --branch "bun-v$bun_version" https://github.com/oven-sh/bun.git "$RUNNER_TEMP/bun-src"
        cd "$RUNNER_TEMP/bun-src"
        llvm_version="$(bun -e 'import { LLVM_VERSION } from "./scripts/build/tools.ts"; console.log(LLVM_VERSION)')"
        if [[ ! "$llvm_version" =~ ^([0-9]+)\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::Unexpected LLVM pin from Bun $bun_version: $llvm_version"
          exit 1
        fi
        echo "llvm_major=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
        echo "Bun $bun_version requires LLVM $llvm_version."

    - name: Install the pinned LLVM toolchain
      shell: bash
      env:
        LLVM_MAJOR: ${{ steps.tools.outputs.llvm_major }}
      run: |
        set -euo pipefail
        retry() {
          local attempt
          for attempt in 1 2 3; do
            if "$@"; then return 0; fi
            if [[ "$attempt" == 3 ]]; then return 1; fi
            sleep $((attempt * 30))
          done
        }
        retry sudo apt-get update -o Acquire::Retries=5
        retry sudo apt-get install -y --no-install-recommends curl wget gnupg software-properties-common ninja-build cmake file binutils
        retry curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 20 --max-time 120 \
          https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
        retry sudo bash "$RUNNER_TEMP/llvm.sh" "$LLVM_MAJOR"
        retry sudo apt-get update -o Acquire::Retries=5
        retry sudo apt-get install -y --no-install-recommends "clang-$LLVM_MAJOR" "lld-$LLVM_MAJOR"

        llvm_resource_dir="$("clang-$LLVM_MAJOR" -print-resource-dir)"
        ndk_prebuilt="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64"
        ndk_clang_version="$(find "$ndk_prebuilt/lib/clang" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -n 1)"
        ndk_runtime_dir="$ndk_prebuilt/lib/clang/$ndk_clang_version/lib/linux"
        test -f "$ndk_runtime_dir/libclang_rt.builtins-aarch64-android.a"
        test -f "$ndk_runtime_dir/aarch64/libunwind.a"
        sudo mkdir -p "$llvm_resource_dir/lib/aarch64-unknown-linux-android28" "$llvm_resource_dir/lib/linux/aarch64"
        sudo ln -sf "$ndk_runtime_dir/libclang_rt.builtins-aarch64-android.a" "$llvm_resource_dir/lib/aarch64-unknown-linux-android28/libclang_rt.builtins.a"
        sudo ln -sf "$ndk_runtime_dir/aarch64/libunwind.a" "$llvm_resource_dir/lib/aarch64-unknown-linux-android28/libunwind.a"
        sudo ln -sf "$ndk_runtime_dir/libclang_rt.builtins-aarch64-android.a" "$llvm_resource_dir/lib/linux/libclang_rt.builtins-aarch64-android.a"
        sudo ln -sf "$ndk_runtime_dir/aarch64/libunwind.a" "$llvm_resource_dir/lib/linux/aarch64/libunwind.a"
        mkdir -p "$RUNNER_TEMP/android-toolchain-bin"
        ln -sf "$ndk_prebuilt/bin/llvm-strip" "$RUNNER_TEMP/android-toolchain-bin/strip"

    - name: Compile Bun's Android release profile
      shell: bash
      env:
        LLVM_MAJOR: ${{ steps.tools.outputs.llvm_major }}
      run: |
        set -euo pipefail
        export CC="clang-$LLVM_MAJOR"
        export CXX="clang++-$LLVM_MAJOR"
        export LD="ld.lld-$LLVM_MAJOR"
        export PATH="$RUNNER_TEMP/android-toolchain-bin:$PATH"
        cd "$RUNNER_TEMP/bun-src"
        bun_build="$PWD/build/android-ffi"
        bun install --frozen-lockfile
        bun scripts/build.ts --profile=android-release --tinycc=on --build-dir="$bun_build" --target=bun -j"$(nproc)"
        test -x "$bun_build/bun"
        file "$bun_build/bun"
        echo "OPENCODE_ANDROID_BUN=$bun_build/bun" >> "$GITHUB_ENV"
