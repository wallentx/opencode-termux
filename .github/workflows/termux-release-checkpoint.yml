name: termux-release-checkpoint

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: "Release branch to checkpoint from"
        required: true
        type: string
      source_sha:
        description: "Release branch SHA; defaults to source branch head"
        required: false
        type: string
        default: ""
      destination_branch:
        description: "Reusable Termux patch branch"
        required: false
        type: string
        default: "termux-target"
      reviewer:
        description: "GitHub username to request as reviewer"
        required: false
        type: string
        default: "wallentx"

permissions:
  actions: read
  artifact-metadata: read
  attestations: read
  checks: read
  contents: write
  deployments: read
  discussions: read
  id-token: none
  issues: write
  models: read
  packages: read
  pages: read
  pull-requests: write
  security-events: read
  statuses: read

concurrency:
  group: termux-release-checkpoint-${{ inputs.source_branch }}-${{ inputs.destination_branch }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  checkpoint:
    if: github.repository == 'wallentx/opencode-termux'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Export GitHub App token for gh
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: echo "GH_TOKEN=${APP_TOKEN}" >> "${GITHUB_ENV}"

      - name: Checkout destination branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.destination_branch }}
          token: ${{ steps.app-token.outputs.token }}

      - name: 🧰 Actions Toolbox
        uses: wallentx/gh-actions/composite/actions-toolbox@main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          checkout: false

      - name: Validate GitHub CLI environment
        run: bash .github/scripts/termux-validate-gh-env.sh

      - name: Configure git
        run: bash .github/scripts/termux-configure-git.sh --origin "${SOURCE_BRANCH}" "${DESTINATION_BRANCH}"
        env:
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          DESTINATION_BRANCH: ${{ inputs.destination_branch || 'termux-target' }}

      - name: Create checkpoint PR
        id: checkpoint-pr
        env:
          REQUESTED_SOURCE_BRANCH: ${{ inputs.source_branch }}
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
          DESTINATION_BRANCH: ${{ inputs.destination_branch || 'termux-target' }}
          REVIEWER: ${{ inputs.reviewer || 'wallentx' }}
        run: bash .github/scripts/termux-create-checkpoint-pr.sh

      - name: Delete release branch after merged checkpoint
        if: steps.checkpoint-pr.outputs.pr_url != ''
        env:
          CHECKPOINT_PR: ${{ steps.checkpoint-pr.outputs.pr_url }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
        run: bash .github/scripts/termux-cleanup-release-branch.sh
