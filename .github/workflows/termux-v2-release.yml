name: termux-v2-release

on:
  pull_request:
    branches:
      - dev
    paths:
      - .github/actions/build-android-bun/action.yml
      - .github/actions/build-v2-android-cli/action.yml
      - .github/scripts/termux-patch-v2-build.ts
      - .github/scripts/termux-select-release.sh
      - .github/scripts/termux-publish-v2-release.sh
      - .github/scripts/termux-v2-opentui-android.ts
      - .github/scripts/termux-v2-opentui-android.test.ts
      - .github/workflows/termux-android-artifact-smoke.yml
      - .github/workflows/termux-v2-release.yml
  workflow_call:
    inputs:
      upstream_tag:
        description: "Published upstream V2 release tag, for example v2.3.2"
        required: true
        type: string
    secrets:
      APP_PRIVATE_KEY:
        required: true

permissions:
  actions: read
  contents: read

concurrency:
  group: termux-v2-release-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || inputs.upstream_tag }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build V2 Android artifact
    if: github.repository == 'wallentx/opencode-termux'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      artifact_name: ${{ steps.metadata.outputs.artifact_name }}
      automation_sha: ${{ steps.metadata.outputs.automation_sha }}
      build_version: ${{ steps.metadata.outputs.build_version }}
      release_tag: ${{ steps.metadata.outputs.release_tag }}
      source_sha: ${{ steps.metadata.outputs.source_sha }}
      upstream_tag: ${{ steps.metadata.outputs.upstream_tag }}
      upstream_version: ${{ steps.metadata.outputs.upstream_version }}
    steps:
      - name: Checkout Termux automation
        uses: actions/checkout@v6

      - name: Select upstream V2 release for PR validation
        if: github.event_name == 'pull_request'
        id: preview
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_REPO: anomalyco/opencode
          RELEASE_MAJOR: "2"
          REQUESTED_TAG: ""
          BYPASS_PRIOR_RELEASE_TRAIN: "false"
          DISCOVERY_ONLY: "true"
        run: bash .github/scripts/termux-select-release.sh

      - name: Checkout upstream V2
        uses: actions/checkout@v6
        with:
          repository: anomalyco/opencode
          ref: refs/tags/${{ inputs.upstream_tag || steps.preview.outputs.upstream_tag }}
          fetch-depth: 1
          path: opencode-v2

      - name: Verify release identity
        id: metadata
        env:
          UPSTREAM_TAG: ${{ inputs.upstream_tag || steps.preview.outputs.upstream_tag }}
        run: |
          set -euo pipefail
          source_sha="$(git -C opencode-v2 rev-parse HEAD)"
          source_tree="$(git -C opencode-v2 rev-parse 'HEAD^{tree}')"
          upstream_version="$(node -p "require('./opencode-v2/package.json').version")"
          if [[ ! "$UPSTREAM_TAG" =~ ^v2\.[0-9]+\.[0-9]+$ || "$UPSTREAM_TAG" != "v${upstream_version}" ]]; then
            echo "Upstream tag $UPSTREAM_TAG does not match V2 package version $upstream_version" >&2
            exit 1
          fi
          build_version="${upstream_version}-termux"
          release_tag="${UPSTREAM_TAG}-termux"
          artifact_name="opencode-v2-android-arm64-${release_tag}"
          {
            echo "artifact_name=${artifact_name}"
            echo "automation_sha=$(git rev-parse HEAD)"
            echo "build_version=${build_version}"
            echo "release_tag=${release_tag}"
            echo "source_sha=${source_sha}"
            echo "source_tree=${source_tree}"
            echo "upstream_tag=${UPSTREAM_TAG}"
            echo "upstream_version=${upstream_version}"
          } >> "$GITHUB_OUTPUT"

      - name: Build V2 Android CLI
        uses: ./.github/actions/build-v2-android-cli
        with:
          source-dir: opencode-v2
          version: ${{ steps.metadata.outputs.build_version }}

      - name: Stage V2 Android artifact
        env:
          AUTOMATION_SHA: ${{ steps.metadata.outputs.automation_sha }}
          BUILD_VERSION: ${{ steps.metadata.outputs.build_version }}
          RELEASE_TAG: ${{ steps.metadata.outputs.release_tag }}
          SOURCE_SHA: ${{ steps.metadata.outputs.source_sha }}
          SOURCE_TREE: ${{ steps.metadata.outputs.source_tree }}
          UPSTREAM_REF: ${{ steps.metadata.outputs.upstream_tag }}
          UPSTREAM_VERSION: ${{ steps.metadata.outputs.upstream_version }}
        run: |
          set -euo pipefail
          mkdir -p v2-release
          cp opencode-v2/packages/cli/dist/opencode-android-arm64.tar.gz v2-release/
          (
            cd v2-release
            sha256sum opencode-android-arm64.tar.gz > opencode-android-arm64.tar.gz.sha256
          )
          jq -n \
            --arg automation_sha "$AUTOMATION_SHA" \
            --arg build_version "$BUILD_VERSION" \
            --arg release_tag "$RELEASE_TAG" \
            --arg source_sha "$SOURCE_SHA" \
            --arg source_tree "$SOURCE_TREE" \
            --arg upstream_ref "$UPSTREAM_REF" \
            --arg upstream_version "$UPSTREAM_VERSION" \
            '{
              automation_sha: $automation_sha,
              build_version: $build_version,
              release_tag: $release_tag,
              source_repository: "https://github.com/anomalyco/opencode",
              source_ref: $upstream_ref,
              source_sha: $source_sha,
              source_tree: $source_tree,
              upstream_version: $upstream_version
            }' > v2-release/provenance.json
          cp -a opencode-v2/packages/cli/dist/android-smoke v2-release/

      - name: Upload V2 Android artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.metadata.outputs.artifact_name }}
          if-no-files-found: error
          retention-days: 14
          path: v2-release

  termux-smoke:
    name: Smoke V2 Android artifact in Termux
    needs: build
    if: github.repository == 'wallentx/opencode-termux'
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/termux-android-artifact-smoke.yml
    with:
      artifact_name: ${{ needs.build.outputs.artifact_name }}
      artifact_run_id: ${{ github.run_id }}
      generation: v2

  publish:
    name: Publish V2 release
    needs:
      - build
      - termux-smoke
    if: github.repository == 'wallentx/opencode-termux' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout the tested release automation
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.build.outputs.automation_sha }}
          persist-credentials: false

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Download V2 Android artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: v2-release

      - name: Publish tested V2 release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          AUTOMATION_SHA: ${{ needs.build.outputs.automation_sha }}
          BUILD_VERSION: ${{ needs.build.outputs.build_version }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
          UPSTREAM_TAG: ${{ needs.build.outputs.upstream_tag }}
        working-directory: v2-release
        run: bash ../.github/scripts/termux-publish-v2-release.sh
