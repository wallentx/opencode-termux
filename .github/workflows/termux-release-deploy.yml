name: termux-release-deploy

on:
  push:
    branches:
      - "release-*"
  workflow_dispatch:
    inputs:
      release_branch:
        description: "Release branch to deploy, for example release-1.17.13"
        required: true
        type: string
      release_sha:
        description: "Release branch SHA to deploy; defaults to current branch head"
        required: false
        type: string
        default: ""
      pr_number:
        description: "Merged release PR number, optional with pr_head_sha"
        required: false
        type: string
        default: ""
      pr_head_sha:
        description: "Merged release PR head SHA, optional with pr_number"
        required: false
        type: string
        default: ""
      destination_branch:
        description: "Reusable Termux patch branch to checkpoint into"
        required: false
        type: string
        default: "termux-target"
      reviewer:
        description: "GitHub username to request on checkpoint PR"
        required: false
        type: string
        default: "wallentx"

permissions:
  actions: write
  artifact-metadata: read
  attestations: read
  checks: read
  contents: write
  deployments: write
  discussions: read
  id-token: none
  issues: write
  models: read
  packages: read
  pages: read
  pull-requests: write
  security-events: read
  statuses: read

concurrency:
  group: termux-release-deploy-${{ inputs.release_branch || github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  deploy:
    if: github.repository == 'wallentx/opencode-termux'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      TERMUX_AUTOMATION_DIR: ${{ github.workspace }}/.termux-release-automation
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Export GitHub App token for gh
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: echo "GH_TOKEN=${APP_TOKEN}" >> "${GITHUB_ENV}"

      - name: Checkout release branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_branch || github.ref_name }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Checkout automation helpers
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          ref: ${{ github.workflow_sha }}
          path: .termux-release-automation
          token: ${{ steps.app-token.outputs.token }}

      - name: 🧰 Actions Toolbox
        uses: wallentx/gh-actions/composite/actions-toolbox@main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          checkout: false

      - name: Validate GitHub CLI environment
        run: bash "${TERMUX_AUTOMATION_DIR}/.github/scripts/termux-validate-gh-env.sh"

      - name: Configure git
        run: bash "${TERMUX_AUTOMATION_DIR}/.github/scripts/termux-configure-git.sh"

      - name: Resolve release ref
        id: release-ref
        env:
          INPUT_RELEASE_BRANCH: ${{ inputs.release_branch }}
          INPUT_RELEASE_SHA: ${{ inputs.release_sha }}
        run: bash "${TERMUX_AUTOMATION_DIR}/.github/scripts/termux-resolve-release-ref.sh"

      - name: Read release metadata
        id: metadata
        run: bash "${TERMUX_AUTOMATION_DIR}/.github/scripts/termux-read-release-metadata.sh"

      - name: Find merged release PR
        id: pr
        if: steps.metadata.outputs.deploy == 'true'
        env:
          RELEASE_BRANCH: ${{ steps.release-ref.outputs.branch }}
          RELEASE_SHA: ${{ steps.release-ref.outputs.sha }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          INPUT_PR_HEAD_SHA: ${{ inputs.pr_head_sha }}
        run: bash "${TERMUX_AUTOMATION_DIR}/.github/scripts/termux-find-release-pr.sh"

      - name: Find validated release PR artifact
        id: pr-artifact
        if: steps.metadata.outputs.deploy == 'true' && steps.metadata.outputs.asset_exists != 'true'
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PR_HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          PR_HEAD_REF: ${{ steps.pr.outputs.head_ref }}
        run: bash "${TERMUX_AUTOMATION_DIR}/.github/scripts/termux-find-pr-artifact.sh"

      - name: Create Android build deployment
        id: android-deployment
        if: steps.metadata.outputs.deploy == 'true' && steps.metadata.outputs.asset_exists != 'true' && steps.pr-artifact.outputs.found != 'true'
        env:
          RELEASE_BRANCH: ${{ steps.release-ref.outputs.branch }}
          RELEASE_SHA: ${{ steps.release-ref.outputs.sha }}
          TERMUX_TAG: ${{ steps.metadata.outputs.termux_tag }}
          GH_TOKEN: ${{ github.token }}
        run: bash "${TERMUX_AUTOMATION_DIR}/.github/scripts/termux-create-android-build-deployment.sh"

      - name: Build Android artifact
        if: steps.metadata.outputs.deploy == 'true' && steps.metadata.outputs.asset_exists != 'true' && steps.pr-artifact.outputs.found != 'true'
        uses: ./.github/actions/build-android-cli
        with:
          version: ${{ steps.metadata.outputs.build_version }}
          release: ""
          repo: ${{ github.repository }}

      - name: Promote built Android artifact
        if: steps.metadata.outputs.deploy == 'true' && steps.metadata.outputs.asset_exists != 'true' && steps.pr-artifact.outputs.found != 'true'
        run: |
          set -euo pipefail
          mkdir -p promoted
          cp packages/opencode/dist/opencode-android-arm64.tar.gz promoted/
          sha256sum promoted/opencode-android-arm64.tar.gz

      - name: Download validated release PR artifact
        if: steps.metadata.outputs.deploy == 'true' && steps.metadata.outputs.asset_exists != 'true' && steps.pr-artifact.outputs.found == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ steps.pr-artifact.outputs.artifact_id }}
          github-token: ${{ steps.app-token.outputs.token }}
          path: promoted

      - name: Verify promoted release PR artifact
        if: steps.metadata.outputs.deploy == 'true' && steps.metadata.outputs.asset_exists != 'true' && steps.pr-artifact.outputs.found == 'true'
        env:
          EXPECTED_HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          EXPECTED_PR_NUMBER: ${{ steps.pr.outputs.number }}
          RELEASE_SHA: ${{ steps.release-ref.outputs.sha }}
        run: |
          set -euo pipefail
          expected_tree="$(git rev-parse "${RELEASE_SHA}^{tree}")"
          jq -e \
            --arg expected_head_sha "$EXPECTED_HEAD_SHA" \
            --arg expected_pr_number "$EXPECTED_PR_NUMBER" \
            --arg expected_tree "$expected_tree" \
            '
              .pr_head_sha == $expected_head_sha
              and .pr_number == $expected_pr_number
              and .source_tree == $expected_tree
            ' promoted/provenance.json >/dev/null
          (
            cd promoted
            sha256sum -c opencode-android-arm64.tar.gz.sha256
          )

      - name: Finish Android build deployment
        if: always() && steps.android-deployment.outputs.deployment_id != ''
        env:
          DEPLOYMENT_ID: ${{ steps.android-deployment.outputs.deployment_id }}
          BUILD_RESULT: ${{ job.status }}
          GH_TOKEN: ${{ github.token }}
        run: bash "${TERMUX_AUTOMATION_DIR}/.github/scripts/termux-finish-android-build-deployment.sh"

      - name: Download existing Android artifact if release needs repair
        if: steps.metadata.outputs.deploy == 'true' && steps.metadata.outputs.asset_exists == 'true'
        run: |
          set -euo pipefail
          mkdir -p promoted
          gh release download "${TERMUX_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern opencode-android-arm64.tar.gz \
            --dir promoted \
            --clobber
        env:
          TERMUX_TAG: ${{ steps.metadata.outputs.termux_tag }}

      - name: Create or repair mirrored release
        if: steps.metadata.outputs.deploy == 'true'
        env:
          UPSTREAM_TAG: ${{ steps.metadata.outputs.upstream_tag }}
          UPSTREAM_REPO: ${{ steps.metadata.outputs.upstream_repo }}
          UPSTREAM_NAME: ${{ steps.metadata.outputs.upstream_name }}
          TERMUX_TAG: ${{ steps.metadata.outputs.termux_tag }}
          UPSTREAM_PRERELEASE: ${{ steps.metadata.outputs.upstream_prerelease }}
          UPSTREAM_HTML_URL: ${{ steps.metadata.outputs.upstream_html_url }}
          RELEASE_TRAIN: ${{ steps.metadata.outputs.release_train }}
          RELEASE_EXISTS: ${{ steps.metadata.outputs.release_exists }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          RELEASE_SHA: ${{ steps.release-ref.outputs.sha }}
        run: bash "${TERMUX_AUTOMATION_DIR}/.github/scripts/termux-create-or-update-mirrored-release.sh"

      - name: Open checkpoint PR
        id: checkpoint-pr
        if: steps.metadata.outputs.deploy == 'true'
        env:
          SOURCE_BRANCH: ${{ steps.release-ref.outputs.branch }}
          SOURCE_SHA: ${{ steps.release-ref.outputs.sha }}
          DESTINATION_BRANCH: ${{ inputs.destination_branch || 'termux-target' }}
          REVIEWER: ${{ inputs.reviewer || 'wallentx' }}
        run: bash "${TERMUX_AUTOMATION_DIR}/.github/scripts/termux-create-checkpoint-pr.sh"

      - name: Delete release branch after merged checkpoint
        if: steps.metadata.outputs.deploy == 'true' && steps.checkpoint-pr.outputs.pr_url != ''
        env:
          CHECKPOINT_PR: ${{ steps.checkpoint-pr.outputs.pr_url }}
          SOURCE_BRANCH: ${{ steps.release-ref.outputs.branch }}
        run: bash "${TERMUX_AUTOMATION_DIR}/.github/scripts/termux-cleanup-release-branch.sh"

      - name: Restore local action metadata
        if: always()
        run: |
          set -euo pipefail
          if [[ ! -d "${TERMUX_AUTOMATION_DIR}/.github/actions" ]]; then
            echo "Automation helpers were not checked out; skipping local action metadata restore."
            exit 0
          fi
          mkdir -p .github/actions
          cp -a "${TERMUX_AUTOMATION_DIR}/.github/actions/build-android-cli" .github/actions/
          cp -a "${TERMUX_AUTOMATION_DIR}/.github/actions/setup-bun" .github/actions/
